<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Thread - ForumHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="brand">
            <span class="brand-icon">F</span>
            <span>ForumHub</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Discussions</a>
            <a href="create-thread.html" class="active">Create Thread</a>
            <a href="notifications.html">Notifications</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- MAIN CONTENT -->
    <main class="create-page">

        <div class="page-heading">
            <p class="eyebrow">COMMUNITY</p>

            <h1>Create a Discussion</h1>

            <p class="page-description">
                Start a conversation, ask a question or share your knowledge.
            </p>
        </div>


        <!-- CREATE THREAD BOX -->
        <section class="create-card">

            <form id="threadForm">

                <!-- TITLE -->
                <div class="form-group">

                    <label for="threadTitle">
                        Discussion Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter your discussion title"
                        required
                    >

                </div>


                <!-- CATEGORY -->
                <div class="form-group">

                    <label for="threadCategory">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Academics">
                            Academics
                        </option>

                        <option value="Projects">
                            Projects
                        </option>

                        <option value="General">
                            General
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="threadDescription">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="8"
                        placeholder="Write your question or discussion here..."
                        required
                    ></textarea>

                </div>


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="threadAuthor">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="threadAuthor"
                        name="author"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- BUTTONS -->
                <div class="form-actions">

                    <a
                        href="index.html"
                        class="secondary-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        + Create Discussion
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/create-thread.js"></script>

</body>
</html>
